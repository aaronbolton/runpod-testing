name: build worker image

on:
  push:
    branches: ["**"]
    paths:
      - Dockerfile
      - requirements.txt
      - "src/**"
      - "tests/**"
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp image tag to build against (see ghcr.io/ggml-org/llama.cpp)"
        default: server-cuda-b10588
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/llamacpp-worker

jobs:
  test:
    # Cheap gate: a typo here would otherwise surface ten minutes into a build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The CUDA base image is several GB; the preinstalled toolchains are not
        # needed and their removal buys ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            LLAMA_TAG=${{ inputs.llama_tag || 'server-cuda-b10588' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Built on \`${{ inputs.llama_tag || 'server-cuda-b10588' }}\`."
            echo "The GHCR package is private until you make it public, or add"
            echo "registry credentials to the RunPod endpoint."
          } >> "$GITHUB_STEP_SUMMARY"
