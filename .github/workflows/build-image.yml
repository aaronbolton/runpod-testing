name: build worker image

# Automatic runs are disabled -- they were slowing down deploy testing.
# Re-enable by restoring the push/pull_request triggers below.
on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp image tag to build against (see ghcr.io/ggml-org/llama.cpp)"
        default: server-cuda-b10588
        required: true

# on:
#   push:
#     branches: ["**"]
#     tags: ["v*"]
#   pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}/llamacpp-worker

jobs:
  test:
    # Cheap gate: a typo here would otherwise surface ten minutes into a build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Hub metadata
        run: |
          python -c "import json; json.load(open('.runpod/hub.json'))"
          python -c "import json; json.load(open('.runpod/tests.json'))"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The CUDA base image is several GB; the preinstalled toolchains are not
        # needed and their removal buys ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Decide whether to publish
        # Ordinary pushes only prove the Dockerfile builds. A published image is
        # for tagged releases, or a deliberate run to change the llama.cpp base.
        id: publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.publish.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publish.outputs.push == 'true' }}
          build-args: |
            LLAMA_TAG=${{ inputs.llama_tag || 'server-cuda-b10588' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            if [ "${{ steps.publish.outputs.push }}" = "true" ]; then
              echo "### Image pushed"
              echo
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              echo
              echo "The GHCR package is private until you make it public, or add"
              echo "registry credentials to the Runpod endpoint."
            else
              echo "### Build verified, not pushed"
              echo
              echo "Publishing happens on a \`v*\` tag or a manual run."
              echo "Hub deployments do not use this image — Runpod builds the"
              echo "Dockerfile itself from the release."
            fi
            echo
            echo "Built on \`${{ inputs.llama_tag || 'server-cuda-b10588' }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
